<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sprint cards · local vs Jira</title>
<style>
  :root {
    --bg: #0d1117; --panel: #010409; --border: #30363d; --text: #e6edf3;
    --muted: #8b949e; --accent: #2f81f7; --add: #3fb950; --add-bg: rgba(46,160,67,0.15);
    --add-word: rgba(46,160,67,0.4); --del: #f85149; --del-bg: rgba(248,81,73,0.15);
    --del-word: rgba(248,81,73,0.4); --mod: #d29922; --row-hover: #161b22;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
  body { display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
  }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; }
  header .meta { font-size: 12px; color: var(--muted); flex: 1; min-width: 140px; }
  .filters { display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--muted); }
  .filters label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
  button, .btn {
    background: #21262d; color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 5px 12px; font-size: 12px; cursor: pointer; font-weight: 500;
  }
  button:hover, .btn:hover { background: #30363d; border-color: #8b949e; }
  button.primary { background: #238636; border-color: #238636; color: #fff; }
  button.active { background: #1f6feb; border-color: #1f6feb; color: #fff; }
  .layout { display: flex; flex: 1; min-height: 0; }
  /* ---- TREE (Linear/Jira style) ---- */
  nav { flex: 1; overflow-y: auto; padding: 10px 10px 28px; background: var(--panel); }
  nav .epic-group {
    margin: 0 0 12px; border-radius: 8px; overflow: hidden;
    background: #0e1319; border: 1px solid #262c36; border-top: 3px solid #8957e5;
  }
  nav .file-row {
    --indent: 0px;
    position: relative; display: grid;
    grid-template-columns: 36px 54px 40px minmax(0, 1fr) auto;
    align-items: center; column-gap: 8px;
    /* The row box itself starts at its indent, so its divider, background,
       hover and selected highlight never reach into the indent gutter. */
    min-height: 52px; padding: 7px 10px 7px 8px; margin-left: var(--indent);
    border-top: 1px solid #1b2129; cursor: pointer;
    color: #c9d1d9; font-size: 13px; line-height: 1.35;
    user-select: none; -webkit-user-select: none; touch-action: pan-y; -webkit-touch-callout: none;
    transition: background 0.12s ease, box-shadow 0.12s ease, transform 0.12s ease, opacity 0.12s ease;
  }
  nav .epic-group > .file-row:first-child { border-top: none; }
  /* Whole-tile tint matching the type pill (translucent, so it starts at the
     row's indent like the divider). Hover is a little stronger. */
  nav .file-row.story   { background: rgba(47,129,247,0.07); }
  nav .file-row.subtask { background: rgba(110,118,129,0.08); }
  nav .file-row.story:hover   { background: rgba(47,129,247,0.13); color: #e6edf3; }
  nav .file-row.subtask:hover { background: rgba(110,118,129,0.15); color: #e6edf3; }
  nav .file-row.active, nav .file-row.story.active, nav .file-row.subtask.active {
    background: rgba(56,139,253,0.30); color: #fff;
    box-shadow: inset 4px 0 0 #58a6ff, inset 0 0 0 1px rgba(88,166,255,0.70);
  }
  nav .file-row.active .t-title { color: #fff; }
  nav .file-row.epic { min-height: 58px; background: rgba(137,87,229,0.09); font-weight: 600; color: #e6edf3; font-size: 13.5px; }
  nav .file-row.epic:hover { background: rgba(137,87,229,0.16); }
  nav .file-row.epic.active { background: rgba(56,139,253,0.30); }
  nav .file-row.story { --indent: 22px; }
  nav .file-row.subtask { --indent: 44px; font-size: 12.5px; min-height: 46px; color: #adbac7; }
  /* Vertical guide lines live in the indent gutter (left of the row box). */
  nav .file-row.story::before, nav .file-row.subtask::before, nav .file-row.subtask::after {
    content: ""; position: absolute; top: -1px; bottom: 0; width: 1px; background: #3a414c; pointer-events: none;
  }
  nav .file-row.story::before { left: -11px; }
  nav .file-row.subtask::before { left: -33px; }
  nav .file-row.subtask::after { left: -11px; }
  nav .file-row.done-item .t-title { color: #8b949e; }
  nav .fold-btn, nav .fold-spacer { width: 36px; height: 36px; }
  nav .fold-btn {
    display: inline-flex; align-items: center; justify-content: center; padding: 0;
    border: 1px solid transparent; border-radius: 8px; background: transparent; color: #8b949e;
    cursor: pointer; touch-action: manipulation;
  }
  nav .fold-btn svg { width: 20px; height: 20px; transition: transform 0.15s ease; }
  nav .fold-btn.open svg { transform: rotate(90deg); }
  nav .fold-btn:hover { background: #21262d; border-color: #30363d; color: #e6edf3; }
  nav .fold-btn:active, nav .fold-btn.pressed { background: #1f6feb; color: #fff; transform: scale(0.94); }
  nav .fold-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .tb {
    display: inline-flex; align-items: center; gap: 5px; font-size: 10px; font-weight: 700; letter-spacing: 0.05em;
    color: #8b949e; white-space: nowrap;
  }
  .tb i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex-shrink: 0; }
  .tb.epic { color: #c297ff; } .tb.epic i { background: #8957e5; }
  .tb.story { color: #79c0ff; } .tb.story i { background: #2f81f7; }
  .tb.subtask { color: #8b949e; } .tb.subtask i { background: #6e7681; }
  .t-num { font-weight: 700; font-size: 12.5px; color: #e6edf3; white-space: nowrap; font-variant-numeric: tabular-nums; }
  nav .t-main { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .t-title { overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; line-clamp: 2; word-break: break-word; }
  .t-kids { font-size: 11px; color: #8b949e; font-weight: 500; }
  .rmeta { display: grid; grid-template-columns: 10px 74px 56px; align-items: center; justify-items: end; column-gap: 8px; }
  .sdot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; justify-self: center; }
  .sdot.new { border: 2px solid #6e7681; } .sdot.indeterminate { background: #d29922; } .sdot.done { background: #3fb950; }
  .sprint-pill {
    font-size: 10px; line-height: 1.3; padding: 1px 7px; border-radius: 999px; white-space: nowrap;
    background: rgba(46,160,67,0.12); color: #56d364; border: 1px solid rgba(46,160,67,0.45);
    max-width: 80px; overflow: hidden; text-overflow: ellipsis; font-weight: 500;
  }
  .sprint-pill.epic-green { background: rgba(46,160,67,0.12); color: #56d364; border-color: rgba(46,160,67,0.45); }
  .sprint-pill.epic-yellow { background: rgba(210,153,34,0.14); color: #e3b341; border-color: rgba(210,153,34,0.5); }
  .dmark { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; white-space: nowrap; }
  .dmark .p { color: #3fb950; } .dmark .m { color: #f85149; } .dmark.fields { color: #d29922; }
  nav .file-row.hold-armed {
    transform: scale(1.015); box-shadow: 0 6px 18px rgba(0,0,0,0.5), inset 0 0 0 1px #388bfd;
    background: #1f2937; cursor: grabbing; z-index: 2;
  }
  nav .file-row.dragging { opacity: 0.6; cursor: grabbing; }
  nav .drop-indicator { height: 0; border-top: 2px solid var(--accent); box-shadow: 0 0 6px var(--accent); pointer-events: none; }
  .nf-card { border-color: #d29922 !important; }
  .nf-title { font-size: 15px; font-weight: 600; color: #e3b341; margin-bottom: 6px; }
  #item-view.not-found .tabs, #item-view.not-found #diff-pane { display: none; }
  /* ---- MAIN ---- */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
  .toolbar {
    display: flex; align-items: center; gap: 8px; padding: 8px 14px;
    border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap;
  }
  .toolbar .title { font-weight: 600; font-size: 13px; flex: 1; min-width: 120px; }
  .view-toggle { display: flex; gap: 0; }
  .view-toggle button { border-radius: 0; }
  .view-toggle button:first-child { border-radius: 6px 0 0 6px; }
  .view-toggle button:last-child { border-radius: 0 6px 6px 0; }
  #changes-view { display: none; flex: 1; overflow: auto; padding: 20px 24px; }
  #changes-view.show { display: block; }
  #item-view { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  #item-view.hide { display: none; }
  .fields-table {
    margin: 12px 16px 0; border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
    font-size: 12px; flex-shrink: 0;
  }
  .fields-table table { width: 100%; border-collapse: collapse; }
  .fields-table th, .fields-table td { padding: 6px 10px; border-bottom: 1px solid var(--border); text-align: left; }
  .fields-table th { background: #161b22; color: var(--muted); font-weight: 600; width: 120px; }
  .fields-table .old { background: var(--del-bg); color: var(--del); text-decoration: line-through; }
  .fields-table .new { background: var(--add-bg); color: var(--add); }
  .diff-scroll { flex: 1; overflow: auto; padding: 12px 16px 24px; }
  /* Split diff */
  .split {
    border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; line-height: 20px;
  }
  .split-head {
    display: grid; grid-template-columns: 1fr 1fr; background: #161b22; border-bottom: 1px solid var(--border);
    font-size: 12px; font-weight: 600; color: var(--muted);
  }
  .split-head div { padding: 8px 12px; }
  .split-head div:first-child { border-right: 1px solid var(--border); }
  .split-row {
    display: grid; grid-template-columns: 52px 1fr 52px 1fr;
    border-top: 1px solid transparent;
  }
  .split-row .ln {
    text-align: right; padding: 0 8px; color: #484f58; user-select: none;
    background: #0d1117; border-right: 1px solid var(--border);
  }
  .split-row .code {
    padding: 0 10px; white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere;
  }
  .split-row .code.left { border-right: 1px solid var(--border); }
  .split-row.del .ln.left, .split-row.del .code.left { background: var(--del-bg); }
  .split-row.add .ln.right, .split-row.add .code.right { background: var(--add-bg); }
  .split-row.mod .ln.left, .split-row.mod .code.left { background: var(--del-bg); }
  .split-row.mod .ln.right, .split-row.mod .code.right { background: var(--add-bg); }
  .split-row .w-del { background: var(--del-word); border-radius: 2px; }
  .split-row .w-add { background: var(--add-word); border-radius: 2px; }
  .split-row.empty .code { background: #0d1117; }
  .hunk-bar {
    display: grid; grid-template-columns: 52px 1fr 52px 1fr;
    background: #121d2f; color: var(--accent); font-size: 11px; cursor: pointer;
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  }
  .hunk-bar:hover { background: #1a2740; }
  .hunk-bar span { padding: 4px 10px; grid-column: 1 / -1; }
  /* Unified */
  .udiff {
    border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; line-height: 20px;
  }
  .udiff .add { background: var(--add-bg); display: block; padding: 0 10px; }
  .udiff .del { background: var(--del-bg); display: block; padding: 0 10px; }
  .udiff .ctx { display: block; padding: 0 10px; }
  .udiff .meta { color: var(--accent); display: block; padding: 4px 10px; background: #121d2f; }
  .udiff .h { color: var(--muted); display: block; padding: 0 10px; }
  /* Rendered md */
  .md-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .md-cols .pane { padding: 14px; overflow: auto; }
  .md-cols .pane:first-child { border-right: 1px solid var(--border); background: rgba(248,81,73,0.04); }
  .md-cols .pane:last-child { background: rgba(46,160,67,0.04); }
  .md h1,.md h2,.md h3 { margin: 0.8em 0 0.3em; } .md p { margin: 0.4em 0; }
  .md ul { padding-left: 1.3em; } .md code { background: #161b22; padding: 1px 4px; border-radius: 3px; }
  .images { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .images figure {
    margin: 0; width: 110px; border: 1px solid var(--border); border-radius: 6px; overflow: hidden;
    position: relative; background: #010409; cursor: pointer;
  }
  .images img { display: block; width: 100%; height: 80px; object-fit: cover; }
  .images figcaption { font-size: 10px; padding: 3px 5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .images .tag {
    position: absolute; top: 4px; left: 4px; font-size: 10px; font-weight: 700; padding: 1px 5px;
    border-radius: 4px; background: #000a;
  }
  .images .tag.add { color: var(--add); } .images .tag.del { color: var(--del); }
  .images .tag.staged { color: var(--mod); } .images .tag.in_jira { color: var(--accent); }
  .notes {
    border-top: 1px solid var(--border); padding: 8px 14px; display: flex; gap: 8px; flex-shrink: 0;
  }
  .notes textarea {
    flex: 1; min-height: 40px; background: #0d1117; color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 8px; font-size: 12px; font-family: inherit;
  }
  .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; align-items: center; justify-content: center; }
  .lightbox.show { display: flex; }
  .lightbox img { max-width: 92vw; max-height: 90vh; }
  .toast {
    position: fixed; bottom: 16px; right: 16px; background: #21262d; border: 1px solid var(--border);
    padding: 10px 14px; border-radius: 8px; font-size: 12px; display: none; z-index: 50; max-width: 400px; white-space: pre-wrap;
  }
  .toast.show { display: block; }
  /* Changes page (GitHub file list) */
  .file-list { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .file-list .fl-head {
    display: flex; justify-content: space-between; padding: 10px 14px; background: #161b22;
    border-bottom: 1px solid var(--border); font-size: 13px; font-weight: 600;
  }
  .file-list .fl-row {
    display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-top: 1px solid var(--border);
    cursor: pointer; font-size: 13px;
  }
  .file-list .fl-row:hover { background: var(--row-hover); }
  .file-list .fl-row .path { flex: 1; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  .empty-state { padding: 40px; color: var(--muted); text-align: center; }

  .fold-bar {
    display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 12px; border-bottom: 1px solid var(--border);
    background: #010409; font-size: 11px;
  }
  .fold-bar button { padding: 3px 8px; font-size: 11px; }
  #numbering-banner {
    display: none; padding: 8px 14px; background: #3d2c00; border-bottom: 1px solid #d29922;
    color: #e3b341; font-size: 12px; flex-shrink: 0;
  }
  #numbering-banner.show { display: block; }
  #numbering-banner a { color: #ffe8a3; cursor: pointer; text-decoration: underline; }
  .order-diff {
    margin: 8px 16px; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border);
    background: #161b22; font-size: 12px; color: var(--mod);
  }


  /* ---- Rendered markdown diff ---- */
  .rdiff { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; font-size: 13px; line-height: 1.5; }
  .rdiff-head { display: grid; grid-template-columns: 1fr 1fr; background: #161b22; border-bottom: 1px solid var(--border);
    font-size: 12px; font-weight: 600; color: var(--muted); }
  .rdiff-head.one { grid-template-columns: 1fr; }
  .rdiff-head div { padding: 8px 12px; } .rdiff-head div:first-child { border-right: 1px solid var(--border); }
  .rdiff-head.one div { border-right: none; }
  .rrow { display: grid; grid-template-columns: 26px 1fr 26px 1fr; border-top: 1px solid #21262d; }
  .urow { display: grid; grid-template-columns: 26px 1fr; border-top: 1px solid #21262d; }
  .rg { text-align: center; font-weight: 700; color: #6e7681; user-select: none; padding-top: 6px;
    font-family: ui-monospace, Menlo, monospace; background: #0d1117; border-right: 1px solid #21262d; }
  .rc { padding: 4px 14px; min-width: 0; overflow-wrap: anywhere; }
  .rc.left { border-right: 1px solid var(--border); }
  .rc.empty { background: repeating-linear-gradient(135deg, #0d1117 0 6px, #11161d 6px 12px); }
  .rrow.del .rc.left, .rrow.mod .rc.left, .urow.del .rc { background: var(--del-bg); }
  .rrow.add .rc.right, .rrow.mod .rc.right, .urow.add .rc { background: var(--add-bg); }
  .rrow.del .rg.left, .rrow.mod .rg.left, .urow.del .rg { color: var(--del); background: rgba(248,81,73,0.15); }
  .rrow.add .rg.right, .rrow.mod .rg.right, .urow.add .rg { color: var(--add); background: rgba(46,160,67,0.15); }
  .rc .w-del { background: var(--del-word); border-radius: 2px; text-decoration: line-through; text-decoration-color: rgba(255,255,255,0.35); }
  .rc .w-add { background: var(--add-word); border-radius: 2px; }
  .rc > :first-child { margin-top: 4px; } .rc > :last-child { margin-bottom: 4px; }
  .rc h1, .rc h2, .rc h3, .rc h4 { margin: 10px 0 4px; line-height: 1.3; }
  .rc h1 { font-size: 1.4em; } .rc h2 { font-size: 1.2em; border-bottom: 1px solid #21262d; padding-bottom: 3px; } .rc h3 { font-size: 1.05em; }
  .rc p { margin: 6px 0; }
  .rc ul, .rc ol { margin: 2px 0; padding-left: 1.5em; }
  .rc ul.task-list { list-style: none; padding-left: 0.4em; }
  .rc ul.task-list input { margin: 0 6px 0 0; vertical-align: -2px; accent-color: var(--add); }
  .rc code { background: #161b22; padding: 1px 5px; border-radius: 4px; font-size: 0.9em; font-family: ui-monospace, Menlo, monospace; }
  .rc pre.md-code { background: #161b22; border: 1px solid #21262d; border-radius: 6px; padding: 8px 10px; overflow: auto; font-size: 12px; }
  .rc pre.md-code code { background: none; padding: 0; }
  .rc table.md-table { border-collapse: collapse; margin: 6px 0; font-size: 12px; width: 100%; }
  .rc table.md-table th, .rc table.md-table td { border: 1px solid #30363d; padding: 4px 8px; text-align: left; vertical-align: top; }
  .rc table.md-table th { background: #161b22; }
  .rc blockquote { margin: 6px 0; padding: 2px 10px; border-left: 3px solid #484f58; color: var(--muted); }
  .rc a { color: var(--accent); }
  .rc img { max-width: 100%; max-height: 320px; border: 1px solid var(--border); border-radius: 4px; }
  .rdiff-fold { border-top: 1px solid #21262d; }
  .rdiff-fold > summary { cursor: pointer; padding: 4px 12px; background: #121d2f; color: var(--accent); font-size: 11px; list-style: none; }
  .rdiff-fold[open] > summary { border-bottom: 1px solid #21262d; }
  .fm-diff { margin: 12px 16px 0; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; font-size: 12px; flex-shrink: 0; }
  .fm-diff > summary { cursor: pointer; padding: 7px 12px; background: #161b22; color: var(--muted); font-weight: 600; }
  .fm-diff table { width: 100%; border-collapse: collapse; }
  .fm-diff th, .fm-diff td { padding: 4px 10px; border-top: 1px solid #21262d; text-align: left; vertical-align: top; }
  .fm-diff thead th { color: var(--muted); background: #0d1117; font-weight: 600; }
  .fm-diff tbody th { color: var(--muted); font-family: ui-monospace, Menlo, monospace; font-weight: 500; width: 150px; }
  .fm-diff .fm-mark { width: 22px; text-align: center; font-weight: 700; font-family: ui-monospace, Menlo, monospace; }
  .fm-diff tr.fm-mod .fm-mark { color: var(--mod); } .fm-diff tr.fm-add .fm-mark { color: var(--add); } .fm-diff tr.fm-del .fm-mark { color: var(--del); }
  .fm-diff tr.fm-mod .fm-l, .fm-diff tr.fm-del .fm-l { background: var(--del-bg); }
  .fm-diff tr.fm-mod .fm-r, .fm-diff tr.fm-add .fm-r { background: var(--add-bg); }
  .fm-diff tr.fm-eq td { color: var(--muted); }
  .fm-chip { display: inline-block; padding: 0 6px; border-radius: 10px; background: #21262d; border: 1px solid #30363d; font-size: 11px; }
  .fm-null { color: #484f58; }
  #mode-raw.active { background: #6e40c9; border-color: #8957e5; color: #fff; }

  /* ---- Item header, tabs, overview ---- */
  .item-head { padding: 14px 20px 0; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); margin-bottom: 6px; min-height: 22px; }
  .crumbs a { display: inline-flex; align-items: center; gap: 6px; padding: 2px 6px; border-radius: 6px; color: var(--muted); cursor: pointer; max-width: 320px; }
  .crumbs a span.c-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .crumbs a:hover { background: #161b22; color: var(--text); }
  .crumbs .cur { color: var(--text); font-weight: 600; padding: 2px 6px; display: inline-flex; gap: 6px; align-items: center; }
  .crumbs .sep { color: #484f58; }
  .item-title-row { display: flex; align-items: flex-start; gap: 16px; }
  #item-title { flex: 1; margin: 0 0 10px; font-size: 18px; font-weight: 600; line-height: 1.3; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  #item-title .ttl-key { font-size: 13px; font-weight: 400; color: var(--muted); font-family: ui-monospace, Menlo, monospace; }
  #diff-badge { padding-top: 4px; }
  .tabs { display: flex; align-items: flex-end; gap: 2px; }
  .tabs .tab { background: none; border: none; border-bottom: 2px solid transparent; border-radius: 0; padding: 8px 14px; color: var(--muted); font-size: 13px; }
  .tabs .tab:hover { background: none; color: var(--text); }
  .tabs .tab.active { color: var(--text); font-weight: 600; border-bottom-color: #f78166; }
  .tabs .tab .cnt { margin-left: 6px; font-size: 11px; background: #21262d; border-radius: 10px; padding: 0 6px; color: var(--muted); }
  .tabs .rev { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; padding-bottom: 8px; }
  .hidden-pane { display: none !important; }
  #overview-pane { flex: 1; overflow: auto; padding: 18px 20px 32px; }
  #diff-pane { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .ov-card { border: 1px solid var(--border); border-radius: 8px; background: #0e1319; margin-bottom: 14px; overflow: hidden; }
  .ov-card.self { border-color: #3d4450; background: #10161e; }
  .ov-head { display: grid; grid-template-columns: 58px 44px minmax(0,1fr) auto; column-gap: 10px; align-items: center; padding: 12px 14px; }
  .ov-card.child > .ov-head { cursor: pointer; }
  .ov-card.child > .ov-head:hover { background: #161b22; }
  .ov-title { font-weight: 600; font-size: 14px; line-height: 1.35; color: #e6edf3; }
  .ov-key { color: var(--muted); font-size: 12px; font-weight: 400; font-family: ui-monospace, Menlo, monospace; margin-left: 6px; }
  .ov-body { padding: 0 14px 12px calc(14px + 58px + 10px); color: #c9d1d9; font-size: 13px; line-height: 1.5; }
  .ov-clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .ov-facts { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .ov-facts b { color: #c9d1d9; font-weight: 600; }
  .ov-facts .warn { color: #ff7b72; }
  .ov-actions { margin-top: 10px; display: flex; gap: 8px; }
  .ov-subs { border-top: 1px solid #1b2129; background: #0b0f14; padding: 4px 0; }
  .ov-sub { display: grid; grid-template-columns: 58px 44px minmax(0,1fr) auto; column-gap: 10px; align-items: start;
    padding: 9px 14px 9px 40px; position: relative; cursor: pointer; border-top: 1px solid #161b22; }
  .ov-sub:first-child { border-top: none; }
  .ov-sub::before { content: ""; position: absolute; left: 24px; top: 0; bottom: 0; width: 1px; background: #3a414c; }
  .ov-sub:hover { background: #161b22; }
  .ov-sub .ov-title { font-size: 13px; font-weight: 500; }
  .ov-sub .ov-prev { font-size: 12px; color: #8b949e; margin-top: 2px; }
  .ov-sub .tb, .ov-sub .t-num { padding-top: 2px; }
  .ov-section { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin: 20px 2px 8px; font-weight: 600; }
  .ov-detail { padding: 2px 16px 16px; border-top: 1px solid #1b2129; }
  .ov-empty { color: var(--muted); font-size: 12px; padding: 4px 0 12px; }
  /* GitHub-like diff file header */
  .rdiff-file { display: flex; align-items: center; gap: 4px; padding: 8px 12px; background: #161b22; border-bottom: 1px solid var(--border); font-size: 12px; }
  .rdiff-file .dstat { font-family: ui-monospace, Menlo, monospace; font-weight: 600; margin-right: 6px; }
  .rdiff-file .dstat .p { color: #3fb950; } .rdiff-file .dstat .m { color: #f85149; }
  .rdiff-file .dbox { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .rdiff-file .dbox.a { background: #3fb950; } .rdiff-file .dbox.d { background: #f85149; } .rdiff-file .dbox.n { background: #30363d; }
  .rdiff-file .dtitle { margin-left: 10px; font-family: ui-monospace, Menlo, monospace; color: var(--text); }
  .rdiff-file .dblocks { margin-left: auto; color: var(--muted); }
  .fm-diff > summary .fm-title { color: var(--text); }
  .fm-s-mod { color: #d29922; } .fm-s-add { color: #3fb950; } .fm-s-del { color: #f85149; }
  .fold-bar { gap: 6px; padding: 8px 10px; background: var(--panel); }
  .fold-bar button { background: transparent; border-color: #30363d; color: #8b949e; border-radius: 8px; }
  .fold-bar button:hover { color: var(--text); background: #161b22; }
</style>
</head>
<body>
<header>
  <h1>Files changed · <span id="sprint-title">Sprint</span></h1>
  <span class="meta" id="meta"></span>
  <div class="filters">
    <label><input type="checkbox" id="hide-done" /> Hide Done</label>
    <label><input type="checkbox" id="only-changed" checked /> Only changed</label>
  </div>
  <button type="button" id="btn-changes">All files</button>
  <button type="button" id="btn-refresh">Refresh</button>
  <button type="button" class="primary" id="btn-pull">Pull from Jira</button>
</header>
<div id="numbering-banner"></div>
<div class="layout">
  <div id="left-pane" style="display:flex;flex-direction:column;width:clamp(460px,36vw,640px);flex-shrink:0;border-right:1px solid var(--border);background:var(--panel);">
    <div class="fold-bar" id="fold-bar">
      <button type="button" data-fold="expand-all" title="Expand everything">Expand all</button>
      <button type="button" data-fold="collapse-all" title="Collapse everything">Collapse all</button>
      <button type="button" data-fold="collapse-epics">Collapse epics</button>
      <button type="button" data-fold="expand-epics">Expand epics</button>
      <button type="button" data-fold="collapse-stories">Collapse stories</button>
      <button type="button" data-fold="expand-stories">Expand stories</button>
      <button type="button" data-fold="collapse-subtasks">Collapse subtasks</button>
      <button type="button" data-fold="expand-subtasks">Expand subtasks</button>
    </div>
    <nav id="nav" style="width:auto;border:none;flex:1;"><div class="empty-state">Loading…</div></nav>
  </div>
  <main>
    <div id="changes-view"></div>
    <div id="item-view">
      <div class="item-head">
        <div class="crumbs" id="crumbs"></div>
        <div class="item-title-row">
          <h2 id="item-title">Select an item</h2>
          <div id="diff-badge"></div>
        </div>
        <div class="tabs">
          <button type="button" class="tab active" id="tab-overview">Overview</button>
          <button type="button" class="tab" id="tab-diff">Diff</button>
          <label class="rev"><input type="checkbox" id="reviewed" /> Reviewed</label>
        </div>
      </div>
      <div id="overview-pane"><div id="overview-host"><div class="empty-state">Select an item in the tree</div></div></div>
      <div id="diff-pane" class="hidden-pane">
        <div class="toolbar">
          <div class="view-toggle">
            <button type="button" class="active" id="mode-split" title="Split diff">Split</button>
            <button type="button" id="mode-unified" title="Unified diff">Unified</button>
            <button type="button" id="mode-render" title="Rendered side by side, no diff marks">Rendered</button>
          </div>
          <button type="button" id="mode-raw" title="Show raw markdown source for this card">Raw</button>
        </div>
        <div id="fields-host"></div>
        <div class="diff-scroll" id="diff-host"><div class="empty-state">Select an item</div></div>
      </div>
      <div class="notes">
        <textarea id="notes" placeholder="Audit notes (local)…"></textarea>
        <button type="button" id="btn-save-note">Save</button>
      </div>
    </div>
  </main>
</div>
<div class="lightbox" id="lightbox"><img alt="" /></div>
<div class="toast" id="toast"></div>
<script src="md-render.js"></script>
<script src="fold-reorder.js"></script>
<script>
(() => {
  let manifest = null, state = { reviewed: {}, notes: {} }, currentId = null, saveTimer = null;
  const LS_DIFFMODE = "sprint-viewer-diffmode-v1", LS_RAW = "sprint-viewer-raw-v1";
  const LS_TAB = "sprint-viewer-tab-v1", LS_FM_OPEN = "sprint-viewer-fm-open-v1";
  let currentTab = (() => { try { return localStorage.getItem(LS_TAB) === "diff" ? "diff" : "overview"; } catch { return "overview"; } })();
  let fmOpen = (() => { try { return localStorage.getItem(LS_FM_OPEN) === "1"; } catch { return false; } })();
  const mdCache = new Map();
  let hideDone = false, onlyChanged = true;
  let viewMode = (() => { try { const v = localStorage.getItem(LS_DIFFMODE); return ["split","unified","render"].includes(v) ? v : "split"; } catch { return "split"; } })();
  let rawMap = (() => { try { return JSON.parse(localStorage.getItem(LS_RAW) || "{}") || {}; } catch { return {}; } })();
  let currentLocal = "", currentJira = "", currentItem = null;

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  const toast = (msg, ms=3200) => { const t=$("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"), ms); };

  function lcsMatrix(a, b) {
    const n=a.length, m=b.length;
    const dp = Array.from({length:n+1}, () => new Uint16Array(m+1));
    for (let i=1;i<=n;i++) for (let j=1;j<=m;j++)
      dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j], dp[i][j-1]);
    return dp;
  }
  function lineOps(A, B) {
    const dp = lcsMatrix(A, B);
    const ops = [];
    let i=A.length, j=B.length;
    while (i>0 || j>0) {
      if (i>0 && j>0 && A[i-1]===B[j-1]) { ops.push({t:"eq", a:A[i-1], b:B[j-1]}); i--; j--; }
      else if (j>0 && (i===0 || dp[i][j-1] >= dp[i-1][j])) { ops.push({t:"add", b:B[j-1]}); j--; }
      else if (i>0) { ops.push({t:"del", a:A[i-1]}); i--; }
      else break;
    }
    ops.reverse();
    return ops;
  }
  function wordHighlight(a, b) {
    const wa=a.split(/(\s+)/), wb=b.split(/(\s+)/);
    const dp=lcsMatrix(wa,wb);
    const stack=[];
    let i=wa.length, j=wb.length;
    while (i>0 || j>0) {
      if (i>0 && j>0 && wa[i-1]===wb[j-1]) { stack.push(["eq", wa[i-1]]); i--; j--; }
      else if (j>0 && (i===0 || dp[i][j-1] >= dp[i-1][j])) { stack.push(["add", wb[j-1]]); j--; }
      else if (i>0) { stack.push(["del", wa[i-1]]); i--; }
      else break;
    }
    stack.reverse();
    let left="", right="";
    for (const [t,v] of stack) {
      if (t==="eq") { left+=esc(v); right+=esc(v); }
      else if (t==="del") left += `<span class="w-del">${esc(v)}</span>`;
      else if (t==="add") right += `<span class="w-add">${esc(v)}</span>`;
    }
    return { left, right };
  }

  function parseCanon(text) {
    if (!text || !text.startsWith("---")) return { metaRaw:"", body: text||"", meta:{} };
    const m = text.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
    if (!m) return { metaRaw:"", body: text, meta:{} };
    const meta = {};
    for (const line of m[1].split("\n")) {
      const km = line.match(/^(\w+):\s*(.*)$/);
      if (km) meta[km[1]] = km[2].replace(/^['"]|['"]$/g,"");
    }
    return { metaRaw: m[1], body: (m[2]||"").replace(/^\n/,""), meta };
  }

  // Pair del+add as modifications; build split rows with collapse
  function buildSplitRows(leftBody, rightBody) {
    const A = leftBody.split("\n"), B = rightBody.split("\n");
    const ops = lineOps(A, B);
    const rows = [];
    let lnL=0, lnR=0, i=0;
    while (i < ops.length) {
      const op = ops[i];
      if (op.t === "eq") {
        lnL++; lnR++;
        rows.push({ kind:"eq", lnL, lnR, left: op.a, right: op.b });
        i++;
      } else if (op.t === "del" && ops[i+1] && ops[i+1].t === "add") {
        lnL++; lnR++;
        const wh = wordHighlight(op.a||"", ops[i+1].b||"");
        rows.push({ kind:"mod", lnL, lnR, leftHtml: wh.left, rightHtml: wh.right, left: op.a, right: ops[i+1].b });
        i += 2;
      } else if (op.t === "del") {
        lnL++;
        rows.push({ kind:"del", lnL, lnR:null, left: op.a, right: "" });
        i++;
      } else if (op.t === "add") {
        lnR++;
        rows.push({ kind:"add", lnL:null, lnR, left: "", right: op.b });
        i++;
      } else i++;
    }
    return rows;
  }

  function renderSplit(host, leftBody, rightBody) {
    const rows = buildSplitRows(leftBody, rightBody);
    // Collapse long unchanged runs (>6) to hunk bars
    const COLLAPSE = Infinity, KEEP = 0; // never fold: always show everything
    const blocks = [];
    let buf = [];
    const flushEq = () => {
      if (!buf.length) return;
      if (buf.length <= COLLAPSE) blocks.push(...buf.map(r => ({type:"row", row:r})));
      else {
        blocks.push(...buf.slice(0, KEEP).map(r => ({type:"row", row:r})));
        blocks.push({ type:"hunk", hidden: buf.slice(KEEP, -KEEP), count: buf.length - 2*KEEP });
        blocks.push(...buf.slice(-KEEP).map(r => ({type:"row", row:r})));
      }
      buf = [];
    };
    for (const r of rows) {
      if (r.kind === "eq") buf.push(r);
      else { flushEq(); blocks.push({type:"row", row:r}); }
    }
    flushEq();

    let html = `<div class="split"><div class="split-head"><div>Jira (base)</div><div>Local (working)</div></div>`;
    const renderRow = (r) => {
      const cls = r.kind === "eq" ? "" : r.kind;
      const lHtml = r.leftHtml != null ? r.leftHtml : esc(r.left ?? "");
      const rHtml = r.rightHtml != null ? r.rightHtml : esc(r.right ?? "");
      return `<div class="split-row ${cls}">
        <div class="ln left">${r.lnL ?? ""}</div>
        <div class="code left">${lHtml || (r.kind==="add" ? "" : "&nbsp;")}</div>
        <div class="ln right">${r.lnR ?? ""}</div>
        <div class="code right">${rHtml || (r.kind==="del" ? "" : "&nbsp;")}</div>
      </div>`;
    };
    for (const b of blocks) {
      if (b.type === "row") html += renderRow(b.row);
      else {
        const id = "h" + Math.random().toString(36).slice(2,8);
        html += `<div class="hunk-bar" data-hunk="${id}"><span>⋯ Expand ${b.count} unchanged lines ⋯</span></div>`;
        html += `<div id="${id}" style="display:none">${b.hidden.map(renderRow).join("")}</div>`;
      }
    }
    html += "</div>";
    host.innerHTML = html;
    host.querySelectorAll(".hunk-bar").forEach(bar => {
      bar.addEventListener("click", () => {
        const el = document.getElementById(bar.dataset.hunk);
        if (!el) return;
        const open = el.style.display !== "none";
        el.style.display = open ? "none" : "block";
        bar.querySelector("span").textContent = open
          ? `⋯ Expand ${el.children.length} unchanged lines ⋯`
          : `⋯ Collapse ${el.children.length} lines ⋯`;
      });
    });
  }

  function renderUnified(host, leftBody, rightBody) {
    const rows = buildSplitRows(leftBody, rightBody);
    let html = `<div class="udiff"><span class="h">--- jira</span><span class="h">+++ local</span>`;
    for (const r of rows) {
      if (r.kind === "eq") html += `<span class="ctx"> ${esc(r.left)}</span>`;
      else if (r.kind === "del") html += `<span class="del">-${esc(r.left)}</span>`;
      else if (r.kind === "add") html += `<span class="add">+${esc(r.right)}</span>`;
      else if (r.kind === "mod") {
        html += `<span class="del">-${esc(r.left)}</span>`;
        html += `<span class="add">+${esc(r.right)}</span>`;
      }
    }
    html += "</div>";
    host.innerHTML = html;
  }

  function renderMarkdown(host, leftBody, rightBody, imgBase) {
    const lHtml = MdDiff.renderBlocksHtml(leftBody || "_(empty)_", { imgBase });
    const rHtml = MdDiff.renderBlocksHtml(rightBody || "_(empty)_", { imgBase });
    host.innerHTML = `<div class="md-cols">
      <div class="pane md rc"><div style="font-size:11px;color:var(--muted);margin-bottom:8px">Jira</div>${lHtml}</div>
      <div class="pane md rc"><div style="font-size:11px;color:var(--muted);margin-bottom:8px">Local</div>${rHtml}</div>
    </div>`;
  }

  function renderRawSource(host, leftText, rightText) {
    host.innerHTML = `<div class="md-cols">
      <div class="pane"><div style="font-size:11px;color:var(--muted);margin-bottom:8px">Jira · raw</div><pre style="white-space:pre-wrap;margin:0;font-size:12px">${esc(leftText)}</pre></div>
      <div class="pane"><div style="font-size:11px;color:var(--muted);margin-bottom:8px">Local · raw</div><pre style="white-space:pre-wrap;margin:0;font-size:12px">${esc(rightText)}</pre></div>
    </div>`;
  }

  function renderFields(item, jMeta, lMeta) {
    const fields = item.field_changes || [];
    // also compute from meta if empty
    const pairs = fields.length ? fields : [];
    const keys = ["summary","story_points","status","labels","parent","type"];
    const computed = [];
    for (const k of keys) {
      const a = jMeta[k], b = lMeta[k];
      if (String(a??"") !== String(b??"") && (a!==undefined || b!==undefined)) {
        if (!pairs.find(p => p.field===k)) computed.push({field:k, old:a, new:b});
      }
    }
    const all = [...pairs, ...computed];
    if (!all.length) { $("fields-host").innerHTML = ""; return; }
    let html = `<div class="fields-table"><table><tr><th>Field</th><th>Jira</th><th>Local</th></tr>`;
    for (const f of all) {
      html += `<tr><th>${esc(f.field)}</th><td class="old">${esc(JSON.stringify(f.old))}</td><td class="new">${esc(JSON.stringify(f.new))}</td></tr>`;
    }
    html += "</table></div>";
    $("fields-host").innerHTML = html;
  }

  function renderImages(host, item) {
    const j = item.jira_images || [], l = item.local_images || [];
    if (!j.length && !l.length) return;
    const jHashes = new Set(j.map(i => i.name));
    const lHashes = new Set(l.map(i => i.name));
    let html = '<div class="images" style="padding:0 0 12px">';
    const all = [...j.map(i=>({...i, side:"jira"})), ...l.map(i=>({...i, side:"local"}))];
    const seen = new Set();
    for (const img of all) {
      const key = img.path || img.name;
      if (seen.has(key)) continue; seen.add(key);
      const st = img.status || (String(img.path||"").includes("/staged/") ? "staged" : String(img.path||"").includes("/jira/") ? "in_jira" : (img.side==="local"?"staged":"in_jira"));
      const tagCls = st === "staged" ? "staged" : st === "removed_locally" ? "del" : st === "in_jira" ? "in_jira" : (img.side==="local"?"add":"");
      const tagTxt = st === "staged" ? "staged" : st === "removed_locally" ? "−" : st === "in_jira" ? "Jira" : "+";
      const src = "/api/file/" + (img.path||"").split("/").map(encodeURIComponent).join("/");
      html += `<figure data-src="${src}" title="${esc(st)}"><span class="tag ${tagCls}">${tagTxt}</span><img src="${src}" loading="lazy"/><figcaption>${esc(img.name)}</figcaption></figure>`;
    }
    html += "</div>";
    host.insertAdjacentHTML("beforeend", html);
    host.querySelectorAll(".images figure").forEach(fig => {
      fig.addEventListener("click", () => {
        $("lightbox").querySelector("img").src = fig.dataset.src;
        $("lightbox").classList.add("show");
      });
    });
  }

  function marker(kind) {
    if (kind === "added") return { cls:"add", ch:"+" };
    if (kind === "removed") return { cls:"del", ch:"−" };
    if (kind === "modified") return { cls:"mod", ch:"●" };
    return { cls:"same", ch:"·" };
  }

  function visible(item) {
    if (hideDone && item.done && item.change_kind === "unchanged") return false;
    if (onlyChanged && item.change_kind === "unchanged" && !item.child_changed) return false;
    return true;
  }


  let foldState = (window.SprintTreeUI && SprintTreeUI.loadFold()) || { epics: {}, stories: {}, subtasks: {} };
  function persistFold() { if (window.SprintTreeUI) SprintTreeUI.saveFold(foldState); }

  // Ancestors opened only to reveal a deep-linked card. Never persisted, so the
  // saved fold state in localStorage is left exactly as the user set it.
  const revealSet = new Set();
  function isCollapsed(kind, id) {
    if (revealSet.has(id)) return false;
    const m = foldState[kind + "s"] || foldState[kind] || {};
    // default expanded => collapsed only if explicitly true
    return m[id] === true;
  }
  function setCollapsed(kind, id, val) {
    const key = kind + "s";
    if (!foldState[key]) foldState[key] = {};
    foldState[key][id] = !!val;
    persistFold();
  }

  function sortedEpics() {
    const sort = (window.SprintTreeUI && SprintTreeUI.sortSiblings) || (a => a);
    const epics = sort(manifest.epics || []);
    for (const e of epics) {
      e.stories = sort(e.stories || []);
      for (const s of e.stories) s.subtasks = sort(s.subtasks || []);
    }
    return epics;
  }


  function sprintPillEl(item, kind) {
    if (kind === "epic") {
      const b = item.sprint_badge;
      if (!b) return null;
      const el = document.createElement("span");
      el.className = "sprint-pill epic-" + b;
      el.textContent = (window.__activeSprintName || "Sprint");
      el.title = item.sprint_badge_title || "";
      return el;
    }
    if (!item.in_active_sprint || !(item.jira_key || item.key)) return null;
    const el = document.createElement("span");
    el.className = "sprint-pill";
    el.textContent = item.sprint_pill || item.sprint || window.__activeSprintName || "Sprint";
    el.title = "In active sprint";
    return el;
  }

  const CHEVRON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const TYPE_LABEL = { epic: "EPIC", story: "STORY", subtask: "SUB" };

  function kindOf(item) {
    if (item.kind === "epic" || item.kind === "story" || item.kind === "subtask") return item.kind;
    return item.stories ? "epic" : item.subtasks ? "story" : "subtask";
  }
  function typeBadge(kind) {
    const k = TYPE_LABEL[kind] ? kind : "story";
    return `<span class="tb ${k}"><i></i>${TYPE_LABEL[k]}</span>`;
  }
  function planLabel(item, kind) {
    const n = item.plan_number;
    if (!n) return "";
    if (kind === "story") return "US " + n;
    return String(n);
  }
  function cleanTitle(item, kind) {
    let t = item.title || item.summary || item.nav_label || item.key || item.id || "";
    if (kind === "story") t = t.replace(/^\s*(User Story|US)\s*\d+\s*[:.\-–]\s*/i, "");
    if (kind === "subtask") t = t.replace(/^\s*\d+\.\d+\s*[:.\-–]?\s*/, "");
    return t;
  }
  function statusDotHtml(item) {
    const sc = item.done ? "done" : (item.status_category || "new");
    const label = (item.status || (sc === "done" ? "Done" : sc === "indeterminate" ? "In progress" : "To Do")) +
      (item.done && item.done_sources && item.done_sources.length ? " · done per " + item.done_sources.join(", ") : "");
    return `<span class="sdot ${esc(sc)}" title="${esc(label)}"></span>`;
  }
  function sprintPillHtml(item, kind) {
    const el = sprintPillEl(item, kind);
    return el ? el.outerHTML : "<span></span>";
  }
  function diffMarkerHtml(item) {
    const ls = item.live_stat;
    if (!ls) return "<span></span>";
    if (ls.kind === "added") return '<span class="dmark" title="Local only (new)"><span class="p">+ new</span></span>';
    if (ls.kind === "removed") return '<span class="dmark" title="Only in Jira"><span class="m">− gone</span></span>';
    if (ls.kind === "fields") return '<span class="dmark fields" title="Only front-matter fields differ">● fields</span>';
    if (ls.kind === "modified") return `<span class="dmark" title="Body lines changed vs Jira"><span class="p">+${ls.plus}</span> <span class="m">−${ls.minus}</span></span>`;
    return "<span></span>";
  }
  function rightMetaHtml(item, kind) {
    return `<span class="rmeta">${statusDotHtml(item)}${sprintPillHtml(item, kind)}${diffMarkerHtml(item)}</span>`;
  }
  function kidsLabel(item, kind) {
    const n = kind === "epic" ? (item.stories || []).length : (item.subtasks || []).length;
    if (!n) return "";
    return n + " " + (kind === "epic" ? (n === 1 ? "story" : "stories") : (n === 1 ? "subtask" : "subtasks"));
  }

  function toggleFold(item, kind) {
    const was = isCollapsed(kind, item.id);
    revealSet.delete(item.id);
    setCollapsed(kind, item.id, !was);
    renderNav();
  }

  function makeRow(cls, item, opts) {
    const kind = cls;
    const row = document.createElement("div");
    row.className = `file-row ${cls}` + (currentId===item.id?" active":"") + (item.done?" done-item":"");
    row.dataset.id = item.id;
    row.dataset.kind = cls;
    row.dataset.localId = item.local_id || "";
    row.draggable = false;
    const hasKids = cls === "epic" ? (item.stories||[]).length : cls === "story" ? (item.subtasks||[]).length : 0;
    const col = hasKids && isCollapsed(cls, item.id);
    if (hasKids) {
      const fb = document.createElement("button");
      fb.type = "button";
      fb.className = "fold-btn" + (col ? "" : " open");
      fb.innerHTML = CHEVRON;
      fb.title = (col ? "Expand · " : "Collapse · ") + kidsLabel(item, cls);
      fb.setAttribute("aria-label", fb.title);
      fb.setAttribute("aria-expanded", col ? "false" : "true");
      fb.draggable = false;
      fb.addEventListener("pointerdown", e => { e.stopPropagation(); fb.classList.add("pressed"); });
      ["pointerup","pointercancel","pointerleave"].forEach(ev => fb.addEventListener(ev, e => { e.stopPropagation(); fb.classList.remove("pressed"); }));
      fb.addEventListener("click", e => { e.stopPropagation(); e.preventDefault(); toggleFold(item, cls); });
      row.appendChild(fb);
    } else {
      const sp = document.createElement("span");
      sp.className = "fold-spacer"; sp.setAttribute("aria-hidden", "true");
      row.appendChild(sp);
    }
    const rest = document.createElement("template");
    const title = cleanTitle(item, kind);
    rest.innerHTML =
      typeBadge(kind) +
      `<span class="t-num">${esc(planLabel(item, kind))}</span>` +
      `<span class="t-main"><span class="t-title">${esc(title)}</span>${col ? `<span class="t-kids">${esc(kidsLabel(item, kind))}</span>` : ""}</span>` +
      rightMetaHtml(item, kind);
    row.appendChild(rest.content);
    row.title = [item.key, title].filter(Boolean).join(" · ");
    bindPressHold(row, item, cls, hasKids);
    return row;
  }

  function siblingList(kind, item) {
    if (kind === "epic") return sortedEpics();
    for (const e of sortedEpics()) {
      if (kind === "story") {
        if ((e.stories||[]).some(s => s.id === item.id)) return e.stories;
      }
      for (const s of e.stories || []) {
        if (kind === "subtask" && (s.subtasks||[]).some(st => st.id === item.id)) return s.subtasks;
      }
    }
    return [];
  }

  async function persistSiblingOrder(kind, siblings) {
    const r = await fetch("/api/reorder", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ kind, ordered_ids: siblings.map(s => s.id) }),
    });
    const data = await r.json();
    if (data.ok && data.manifest) {
      manifest = data.manifest;
      window.__activeSprintName = (manifest.active_sprint || {}).name || "";
      ensureIds();
      renderNav();
      toast("Order saved");
    } else toast("Reorder failed: " + (data.error || r.status));
  }

  // Tile body click/tap: select only. Folding is ONLY via the .fold-btn arrow.
  function tileClick(item) {
    selectItem(item.id);
  }


  let holdState = null;
  let dropLine = null;

  function clearDropLine() {
    if (dropLine && dropLine.parentNode) dropLine.parentNode.removeChild(dropLine);
    dropLine = null;
  }

  function cancelHold(asClick) {
    if (!holdState) return;
    const st = holdState;
    if (st.timer) clearTimeout(st.timer);
    try { st.row.releasePointerCapture(st.pointerId); } catch (_) {}
    st.row.classList.remove("hold-armed", "dragging");
    clearDropLine();
    document.removeEventListener("keydown", onHoldEscape, true);
    const item = st.item, kind = st.kind, hasKids = st.hasKids;
    holdState = null;
    if (asClick) tileClick(item);
  }

  function onHoldEscape(e) {
    if (e.key === "Escape" && holdState) {
      e.preventDefault();
      cancelHold(false);
      toast("Reorder cancelled");
    }
  }

  function siblingRowEls(kind, item) {
    const sibs = siblingList(kind, item);
    const ids = new Set(sibs.map(s => s.id));
    return [...document.querySelectorAll(`nav .file-row[data-kind="${kind}"]`)].filter(el => ids.has(el.dataset.id));
  }

  function updateDropIndicator(clientY, kind, item) {
    const rows = siblingRowEls(kind, item);
    const rects = rows.map(el => {
      const r = el.getBoundingClientRect();
      return { id: el.dataset.id, el, top: r.top, bottom: r.bottom, mid: (r.top + r.bottom) / 2 };
    });
    const ui = window.SprintTreeUI;
    const insertAt = ui ? ui.dropIndexFromY(clientY, rects) : 0;
    clearDropLine();
    dropLine = document.createElement("div");
    dropLine.className = "drop-indicator";
    const nav = $("nav");
    if (!rows.length) {
      nav.appendChild(dropLine);
    } else if (insertAt >= rows.length) {
      rows[rows.length - 1].after(dropLine);
    } else {
      rows[insertAt].before(dropLine);
    }
    const ref = rows[Math.min(insertAt, rows.length - 1)];
    if (ref) dropLine.style.marginLeft = getComputedStyle(ref).marginLeft;
    if (holdState) holdState.dropIndex = insertAt;
    return insertAt;
  }

  function armHold() {
    if (!holdState || holdState.armed) return;
    holdState.armed = true;
    holdState.row.classList.add("hold-armed", "dragging");
    document.addEventListener("keydown", onHoldEscape, true);
  }

  function finishHoldDrop() {
    if (!holdState || !holdState.armed) { cancelHold(true); return; }
    const st = holdState;
    const sibs = siblingList(st.kind, st.item).slice();
    const from = sibs.findIndex(s => s.id === st.item.id);
    let insertAt = st.dropIndex != null ? st.dropIndex : from;
    const ui = window.SprintTreeUI;
    const next = ui ? ui.reorderArray(sibs, from, insertAt) : sibs;
    const same = next.length === sibs.length && next.every((s, i) => s.id === sibs[i].id);
    st.row.classList.remove("hold-armed", "dragging");
    clearDropLine();
    try { st.row.releasePointerCapture(st.pointerId); } catch (_) {}
    document.removeEventListener("keydown", onHoldEscape, true);
    if (st.timer) clearTimeout(st.timer);
    holdState = null;
    if (same) return;
    next.forEach((s, i) => { s.order = i + 1; });
    persistSiblingOrder(st.kind, next);
  }

  function bindPressHold(row, item, kind, hasKids) {
    const HOLD = (window.SprintTreeUI && SprintTreeUI.HOLD_MS) || 350;
    const MOVE = (window.SprintTreeUI && SprintTreeUI.MOVE_PX) || 6;

    row.addEventListener("pointerdown", e => {
      if (e.button != null && e.button !== 0) return;
      if (e.target && e.target.closest && e.target.closest("input.check, .fold-btn")) return;
      e.preventDefault();
      if (holdState) cancelHold(false);
      holdState = {
        item, kind, row, hasKids,
        pointerId: e.pointerId,
        x0: e.clientX, y0: e.clientY,
        armed: false, dropIndex: null, cancelledMove: false,
        timer: null,
      };
      try { row.setPointerCapture(e.pointerId); } catch (_) {}
      holdState.timer = setTimeout(() => {
        if (!holdState || holdState.row !== row || holdState.cancelledMove) return;
        armHold();
      }, HOLD);
    });

    row.addEventListener("pointermove", e => {
      if (!holdState || holdState.row !== row) return;
      const dx = e.clientX - holdState.x0;
      const dy = e.clientY - holdState.y0;
      if (!holdState.armed) {
        if (window.SprintTreeUI ? SprintTreeUI.shouldCancelHold(dx, dy, MOVE) : Math.hypot(dx, dy) > MOVE) {
          if (holdState.timer) clearTimeout(holdState.timer);
          holdState.timer = null;
          holdState.cancelledMove = true;
        }
        return;
      }
      e.preventDefault();
      updateDropIndicator(e.clientY, kind, item);
    });

    row.addEventListener("pointerup", e => {
      if (!holdState || holdState.row !== row) return;
      if (holdState.armed) {
        updateDropIndicator(e.clientY, kind, item);
        finishHoldDrop();
        return;
      }
      if (holdState.timer) clearTimeout(holdState.timer);
      try { row.releasePointerCapture(holdState.pointerId); } catch (_) {}
      const it = holdState.item, k = holdState.kind, hk = holdState.hasKids;
      holdState = null;
      clearDropLine();
      tileClick(it);
    });

    row.addEventListener("pointercancel", () => {
      if (holdState && holdState.row === row) cancelHold(false);
    });

    row.addEventListener("dragstart", e => { e.preventDefault(); });
    // Touch: once the hold has armed, stop the page from scrolling so the drag follows the finger
    row.addEventListener("touchmove", e => {
      if (holdState && holdState.row === row && holdState.armed && e.cancelable) e.preventDefault();
    }, { passive: false });
  }


  function ensureIds() {
    for (const e of manifest.epics||[]) {
      e.id = e.id || e.folder;
      for (const s of e.stories||[]) {
        s.id = s.id || s.folder;
        for (const st of s.subtasks||[]) st.id = st.id || st.folder;
      }
    }
  }

  function renderNav() {
    const nav = $("nav");
    if (!manifest?.epics) { nav.innerHTML='<div class="empty-state">No data</div>'; return; }
    ensureIds();
    const frag = document.createDocumentFragment();
    for (const epic of sortedEpics()) {
      const anyChild = (epic.stories||[]).some(s => visible(s) || s.change_kind!=="unchanged" || (s.subtasks||[]).some(t=>t.change_kind!=="unchanged"));
      if (onlyChanged && epic.change_kind==="unchanged" && !anyChild && !epic.child_changed) continue;
      const group = document.createElement("div");
      group.className = "epic-group";
      group.appendChild(makeRow("epic", epic));
      if (!isCollapsed("epic", epic.id)) {
        for (const story of epic.stories || []) {
          if (onlyChanged && story.change_kind==="unchanged" && !(story.subtasks||[]).some(t=>t.change_kind!=="unchanged")) continue;
          if (hideDone && story.done && story.change_kind==="unchanged" && !(story.subtasks||[]).some(t=>t.change_kind!=="unchanged")) continue;
          group.appendChild(makeRow("story", story));
          if (isCollapsed("story", story.id)) continue;
          for (const st of story.subtasks || []) {
            if (onlyChanged && st.change_kind==="unchanged") continue;
            if (hideDone && st.done && st.change_kind==="unchanged") continue;
            group.appendChild(makeRow("subtask", st));
          }
        }
      }
      frag.appendChild(group);
    }
    if ((manifest.unmatched_local || []).length) {
      const group = document.createElement("div");
      group.className = "epic-group";
      for (const it of manifest.unmatched_local) group.appendChild(makeRow("story", it));
      frag.appendChild(group);
    }
    nav.innerHTML = "";
    nav.appendChild(frag);
  }

  function applyFoldCommand(cmd) {
    revealSet.clear();
    ensureIds();
    const epics = sortedEpics();
    if (cmd === "expand-all") {
      foldState = { epics: {}, stories: {}, subtasks: {} };
    } else if (cmd === "collapse-all") {
      foldState = { epics: {}, stories: {}, subtasks: {} };
      for (const e of epics) {
        foldState.epics[e.id] = true;
        for (const s of e.stories||[]) {
          foldState.stories[s.id] = true;
          for (const st of s.subtasks||[]) foldState.subtasks[st.id] = true;
        }
      }
    } else if (cmd === "collapse-epics") {
      for (const e of epics) foldState.epics[e.id] = true;
    } else if (cmd === "expand-epics") {
      for (const e of epics) foldState.epics[e.id] = false;
    } else if (cmd === "collapse-stories") {
      for (const e of epics) for (const s of e.stories||[]) foldState.stories[s.id] = true;
    } else if (cmd === "expand-stories") {
      for (const e of epics) for (const s of e.stories||[]) foldState.stories[s.id] = false;
    } else if (cmd === "collapse-subtasks") {
      for (const e of epics) for (const s of e.stories||[]) for (const st of s.subtasks||[]) foldState.subtasks[st.id] = true;
    } else if (cmd === "expand-subtasks") {
      for (const e of epics) for (const s of e.stories||[]) for (const st of s.subtasks||[]) foldState.subtasks[st.id] = false;
    }
    persistFold();
    renderNav();
  }


  function findItem(id) {
    for (const epic of manifest.epics || []) {
      if (epic.id === id) return epic;
      for (const s of epic.stories || []) {
        if (s.id === id) return s;
        for (const st of s.subtasks || []) if (st.id === id) return st;
      }
    }
    for (const it of manifest.unmatched_local || []) if (it.id === id) return it;
    return null;
  }

  async function fetchText(rel) {
    if (!rel) return "";
    const r = await fetch("/api/file/" + rel.split("/").map(encodeURIComponent).join("/"), { cache:"no-store" });
    return r.ok ? await r.text() : "";
  }

  function paintDiff() {
    const host = $("diff-host");
    if (!currentItem) return;
    const raw = !!rawMap[currentItem.id];
    $("mode-raw").classList.toggle("active", raw);
    $("mode-raw").title = raw ? "Showing raw markdown source — click for formatted view" : "Show raw markdown source for this card";
    const fm = MdDiff.renderFrontMatterDiff(currentJira, currentLocal, { leftLabel: "Jira", rightLabel: "Local", open: fmOpen });
    $("fields-host").innerHTML = fm.html;
    const det = $("fields-host").querySelector("details.fm-diff");
    if (det) det.addEventListener("toggle", () => {
      fmOpen = det.open;
      try { localStorage.setItem(LS_FM_OPEN, fmOpen ? "1" : "0"); } catch (_) {}
    });
    const L = fm.left, R = fm.right;
    const imgBase = currentItem.folder
      ? "/compare/" + currentItem.folder.split("/").map(encodeURIComponent).join("/") + "/"
      : null;
    if (raw) {
      if (viewMode === "split") renderSplit(host, L.body, R.body);
      else if (viewMode === "unified") renderUnified(host, L.body, R.body);
      else renderRawSource(host, currentJira, currentLocal);
    } else if (viewMode === "split") {
      host.innerHTML = MdDiff.renderSplitDiff(L.body, R.body, { imgBase, title: diffTitle(currentItem), leftLabel: "Jira (base)", rightLabel: "Local (working)" }).html;
    } else if (viewMode === "unified") {
      host.innerHTML = MdDiff.renderUnifiedDiff(L.body, R.body, { imgBase, title: diffTitle(currentItem), leftLabel: "Jira", rightLabel: "Local" }).html;
    } else {
      renderMarkdown(host, L.body, R.body, imgBase);
    }
    host.dataset.mode = viewMode + (raw ? "-raw" : "");
    renderImages(host, currentItem);
  }

  async function selectItem(id, opts) {
    const how = (opts && opts.history) || "push";
    currentId = id;
    showItemView();
    renderNav();
    const item = findItem(id);
    if (!item) return;
    currentItem = item;
    $("item-view").classList.remove("not-found");
    const kind = kindOf(item);
    document.title = `${planLabel(item, kind)} ${cleanTitle(item, kind)} · Sprint plan`;
    renderCrumbs(item);
    $("item-title").innerHTML = typeBadge(kind) +
      `<span class="t-num">${esc(planLabel(item, kind))}</span>` +
      `<span>${esc(cleanTitle(item, kind))}</span>` +
      (item.key ? `<span class="ttl-key">${esc(item.key)}</span>` : `<span class="ttl-key">local only</span>`);
    $("diff-badge").innerHTML = rightMetaHtml(item, kind);
    $("reviewed").checked = !!state.reviewed[id];
    $("notes").value = state.notes[id] || "";
    setTab(currentTab, true);
    if (how !== "none") syncUrl(how);
    const navRow = document.querySelector(`nav .file-row.active`);
    if (navRow) navRow.scrollIntoView({ block: "nearest" });
    renderOverview(item);
    $("diff-host").innerHTML = '<div class="empty-state">Loading…</div>';
    const [localMd, jiraMd] = await Promise.all([fetchText(item.local_md), fetchText(item.jira_md)]);
    currentLocal = localMd; currentJira = jiraMd;
    // unmatched local file: treat whole file as added
    if (!item.local_md && item.folder?.startsWith("_unmatched_local")) {
      const r = await fetch("/api/file/" + item.folder.split("/").map(encodeURIComponent).join("/"), {cache:"no-store"});
      currentLocal = r.ok ? await r.text() : "";
      currentJira = "";
    }
    paintDiff();
    const odPrev = document.getElementById("order-diff-host");
    if (odPrev) odPrev.remove();
    if (item.jira_order != null && item.order != null && Number(item.jira_order) !== Number(item.order)) {
      const d = document.createElement("div");
      d.id = "order-diff-host";
      d.className = "order-diff";
      d.textContent = `↕ Order changed vs Jira: ${item.jira_order} → ${item.order} (like a move/rename)`;
      const fh = $("fields-host");
      if (fh && fh.parentNode) fh.parentNode.insertBefore(d, fh);
      else $("diff-host").parentNode.insertBefore(d, $("diff-host"));
    }
  }


  function diffTitle(item) {
    return [item.key || "local", (item.local_md || "").split("/").pop()].filter(Boolean).join(" · ");
  }

  function pathTo(id) {
    for (const e of manifest.epics || []) {
      if (e.id === id) return [e];
      for (const s of e.stories || []) {
        if (s.id === id) return [e, s];
        for (const st of s.subtasks || []) if (st.id === id) return [e, s, st];
      }
    }
    const it = findItem(id);
    return it ? [it] : [];
  }

  function renderCrumbs(item) {
    const path = pathTo(item.id);
    const host = $("crumbs");
    host.innerHTML = path.map((p, i) => {
      const k = kindOf(p);
      const inner = typeBadge(k) + `<b>${esc(planLabel(p, k))}</b><span class="c-t">${esc(cleanTitle(p, k))}</span>`;
      const last = i === path.length - 1;
      return (i ? '<span class="sep">›</span>' : "") + (last ? `<span class="cur">${inner}</span>` : `<a data-goto="${esc(p.id)}">${inner}</a>`);
    }).join("");
  }

  function setTab(tab, silent) {
    currentTab = tab === "diff" ? "diff" : "overview";
    if (!silent) { try { localStorage.setItem(LS_TAB, currentTab); } catch (_) {} }
    $("tab-overview").classList.toggle("active", currentTab === "overview");
    $("tab-diff").classList.toggle("active", currentTab === "diff");
    $("overview-pane").classList.toggle("hidden-pane", currentTab !== "overview");
    $("diff-pane").classList.toggle("hidden-pane", currentTab !== "diff");
  }

  async function localText(item) {
    if (!item || !item.local_md) return "";
    if (mdCache.has(item.local_md)) return mdCache.get(item.local_md);
    const txt = await fetchText(item.local_md);
    mdCache.set(item.local_md, txt);
    return txt;
  }

  function cardInfo(text) {
    const body = MdDiff.parseFrontMatter(text || "").body;
    const blocks = MdDiff.splitBlocks(body);
    const firstP = blocks.find(b => b.type === "p");
    const preview = firstP ? MdDiff.renderInline(firstP.src.replace(/\s*\n\s*/g, " ")) : "";
    let ac = 0, acDone = 0, inAc = false, acFromHeading = 0;
    for (const b of blocks) {
      if (b.type === "heading") { inAc = /acceptance/i.test(b.src); continue; }
      if (b.type === "li") {
        const m = b.src.match(/^\s*(?:[-*+]|\d+[.)])\s+\[( |x|X)\]/);
        if (m) { ac++; if (m[1] !== " ") acDone++; }
        else if (inAc) acFromHeading++;
      }
    }
    if (!ac && acFromHeading) ac = acFromHeading;
    return { preview, ac, acDone, body };
  }

  function factsHtml(item, info, extra) {
    const f = [];
    if (item.status) f.push(`<span>Status <b>${esc(item.status)}</b></span>`);
    if (info && info.ac) f.push(`<span><b>${info.ac}</b> acceptance criteria${info.acDone ? ` · ${info.acDone} checked` : ""}</span>`);
    if (item.story_points != null && item.story_points !== "") f.push(`<span><b>${esc(item.story_points)}</b> pts</span>`);
    if (extra) f.push(extra);
    if (item.done_sources && item.done_sources.length) f.push(`<span>Done per <b>${esc(item.done_sources.join(", "))}</b></span>`);
    if (item.done_mismatch && item.done_mismatch.length) f.push(`<span class="warn">≠ ${esc(item.done_mismatch.join(", "))}</span>`);
    if (item.jira_order != null && item.order != null && Number(item.jira_order) !== Number(item.order)) f.push(`<span>↕ order ${esc(item.jira_order)} → ${esc(item.order)} vs Jira</span>`);
    return f.length ? `<div class="ov-facts">${f.join("")}</div>` : "";
  }

  function headHtml(item, kind) {
    const title = cleanTitle(item, kind);
    return `<div class="ov-head">${typeBadge(kind)}<span class="t-num">${esc(planLabel(item, kind))}</span>` +
      `<span class="ov-title">${esc(title)}${item.key ? `<span class="ov-key">${esc(item.key)}</span>` : `<span class="ov-key">local only</span>`}</span>` +
      `${rightMetaHtml(item, kind)}</div>`;
  }

  let ovToken = 0;
  async function renderOverview(item) {
    const token = ++ovToken;
    const host = $("overview-host");
    const kind = kindOf(item);
    const kids = kind === "epic" ? (item.stories || []) : kind === "story" ? (item.subtasks || []) : [];
    const grand = kind === "epic" ? kids.flatMap(s => s.subtasks || []) : [];
    host.innerHTML = '<div class="empty-state">Loading…</div>';
    const all = [item, ...kids, ...grand];
    const texts = await Promise.all(all.map(localText));
    if (token !== ovToken) return;
    const info = new Map(all.map((it, i) => [it.id, cardInfo(texts[i])]));
    const selfInfo = info.get(item.id);
    const imgBase = item.folder ? "/compare/" + item.folder.split("/").map(encodeURIComponent).join("/") + "/" : null;
    let html = `<div class="ov-card self">${headHtml(item, kind)}`;
    if (kind === "subtask" || !kids.length) {
      html += `<div class="ov-body">${factsHtml(item, selfInfo)}<div class="ov-actions"><button type="button" data-tab="diff">Open diff</button></div></div>`;
      html += `<div class="ov-detail rc">${selfInfo.body.trim() ? MdDiff.renderBlocksHtml(selfInfo.body, { imgBase }) : '<div class="ov-empty">No description.</div>'}</div>`;
    } else {
      const sub = kind === "epic" ? `<span><b>${kids.length}</b> ${kids.length === 1 ? "story" : "stories"} · <b>${grand.length}</b> subtasks</span>` : `<span><b>${kids.length}</b> subtasks</span>`;
      html += `<div class="ov-body">${selfInfo.preview ? `<div class="ov-clamp">${selfInfo.preview}</div>` : ""}${factsHtml(item, selfInfo, sub)}` +
        `<div class="ov-actions"><button type="button" data-tab="diff">Open diff</button></div></div>`;
    }
    html += `</div>`;
    if (kids.length) {
      html += `<div class="ov-section">${kind === "epic" ? "Stories" : "Subtasks"} · ${kids.length}</div>`;
      for (const k of kids) {
        const kk = kindOf(k);
        const ki = info.get(k.id);
        html += `<div class="ov-card child" data-kind="${kk}">` +
          `<div data-goto="${esc(k.id)}">${headHtml(k, kk)}</div>` +
          `<div class="ov-body" data-goto="${esc(k.id)}" style="cursor:pointer">${ki.preview ? `<div class="ov-clamp">${ki.preview}</div>` : '<div class="ov-empty">No description in the local card.</div>'}${factsHtml(k, ki)}</div>`;
        const subs = kk === "story" ? (k.subtasks || []) : [];
        if (subs.length) {
          html += `<div class="ov-subs">`;
          for (const s of subs) {
            const si = info.get(s.id) || cardInfo("");
            const sk = kindOf(s);
            html += `<div class="ov-sub" data-goto="${esc(s.id)}">${typeBadge(sk)}<span class="t-num">${esc(planLabel(s, sk))}</span>` +
              `<span><div class="ov-title">${esc(cleanTitle(s, sk))}${s.key ? `<span class="ov-key">${esc(s.key)}</span>` : ""}</div>` +
              `<div class="ov-prev ov-clamp">${si.preview || ""}${si.ac ? ` <b>· ${si.ac} AC</b>` : ""}</div></span>` +
              `${rightMetaHtml(s, sk)}</div>`;
          }
          html += `</div>`;
        }
        html += `</div>`;
      }
    }
    host.innerHTML = html;
  }

  function showItemView() {
    $("changes-view").classList.remove("show");
    $("item-view").classList.remove("hide");
  }
  async function showChangesPage() {
    $("changes-view").classList.add("show");
    $("item-view").classList.add("hide");
    let data = {};
    try { data = await (await fetch("/api/diff-stat",{cache:"no-store"})).json(); } catch(e) {}
    const cc = manifest.change_counts || {};
    let html = `<div class="file-list">
      <div class="fl-head">
        <span>${(data.items||[]).length} changed files</span>
        <span class="stat"><span class="p">+${data.total_plus||0}</span> <span class="m">−${data.total_minus||0}</span>
          · +${cc.added||0} / −${cc.removed||0} / ●${cc.modified||0}</span>
      </div>`;
    // Build file list from epics
    const rows = [];
    for (const epic of manifest.epics||[]) {
      const walk = (it, kind) => {
        if (it.change_kind && it.change_kind !== "unchanged") {
          rows.push({ item: it, kind });
        }
        for (const s of it.stories||[]) {
          if (s.change_kind !== "unchanged") rows.push({item:s, kind:"story"});
          for (const st of s.subtasks||[]) if (st.change_kind !== "unchanged") rows.push({item:st, kind:"subtask"});
        }
      };
      walk(epic, "epic");
    }
    for (const it of manifest.unmatched_local||[]) rows.push({item:it, kind:"added"});
    for (const {item, kind} of rows) {
      const mk = marker(item.change_kind);
      const st = item.diff_stat || {};
      html += `<div class="fl-row" data-id="${esc(item.id)}">
        <span class="marker ${mk.cls}">${mk.ch}</span>
        <span class="path">${esc(item.nav_label || item.key || item.title || item.id)}</span>
        <span class="stat"><span class="p">+${st.plus||0}</span> <span class="m">−${st.minus||0}</span></span>
      </div>`;
    }
    html += "</div>";
    $("changes-view").innerHTML = html;
    $("changes-view").querySelectorAll(".fl-row").forEach(row => {
      row.addEventListener("click", () => selectItem(row.dataset.id));
    });
  }

  async function loadManifest() {
    const r = await fetch("/api/manifest", { cache:"no-store" });
    if (!r.ok) throw new Error("manifest missing");
    manifest = await r.json();
    mdCache.clear();
    window.__activeSprintName = (manifest.active_sprint && manifest.active_sprint.name) || ""; { const t = document.getElementById("sprint-title"); if (t) t.textContent = manifest.title || "Sprint"; };
    // ensure ids
    for (const e of manifest.epics||[]) {
      e.id = e.id || e.folder;
      for (const s of e.stories||[]) {
        s.id = s.id || s.folder;
        for (const st of s.subtasks||[]) st.id = st.id || st.folder;
      }
    }
    const c = manifest.counts||{}, cc = manifest.change_counts||{};
    $("meta").textContent = `+${cc.added||0} −${cc.removed||0} ●${cc.modified||0} · done≠${(manifest.done_mismatches||[]).length} · ${c.format||""}`;
    renderNav();
  }
  async function loadState() {
    state = await (await fetch("/api/state",{cache:"no-store"})).json();
    state.reviewed = state.reviewed||{}; state.notes = state.notes||{};
  }
  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => fetch("/api/state",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(state)}), 400);
  }


  // ---- URL state (hash routing; works on a plain refresh with no server change) ----
  //   #/card/<ref>?tab=overview|diff&mode=split|unified|rendered[&raw=1]
  //   <ref> = Jira key (PROJ-123), else local_id, else plan path (S1/US3/3.3).
  // Breadcrumbs are always the card's own Epic › Story › Subtask path, so the
  // card ref is enough to rebuild them. Global prefs stay in localStorage.
  const MODE_TO_URL = { split: "split", unified: "unified", render: "rendered" };
  const URL_TO_MODE = { split: "split", unified: "unified", rendered: "render", render: "render" };
  let lastHash = null;
  function cardRef(item) {
    if (!item) return "";
    if (item.jira_key || item.key) return item.jira_key || item.key;
    if (item.local_id) return String(item.local_id);
    const path = pathTo(item.id);
    if (path.length && path.every(x => x.plan_number)) {
      return path.map(x => kindOf(x) === "story" ? "US" + x.plan_number : String(x.plan_number)).join("/");
    }
    return item.id;
  }
  function allItems() {
    const out = [];
    for (const e of manifest.epics || []) {
      out.push(e);
      for (const s of e.stories || []) { out.push(s); for (const st of s.subtasks || []) out.push(st); }
    }
    for (const it of manifest.unmatched_local || []) out.push(it);
    return out;
  }
  function findByRef(ref) {
    if (!ref) return null;
    const norm = s => String(s || "").replace(/\s+/g, "").toLowerCase();
    const r = norm(ref);
    const items = allItems();
    return items.find(it => norm(it.jira_key || it.key) === r)
        || items.find(it => it.local_id != null && norm(it.local_id) === r)
        || items.find(it => it.id === ref)
        || items.find(it => norm(cardRef(it)) === r)
        || null;
  }
  function buildHash() {
    if (!currentItem) return location.hash;
    const ref = cardRef(currentItem).split("/").map(encodeURIComponent).join("/");
    const q = new URLSearchParams({ tab: currentTab, mode: MODE_TO_URL[viewMode] || "split" });
    if (rawMap[currentItem.id]) q.set("raw", "1");
    return `#/card/${ref}?${q.toString()}`;
  }
  function parseHash() {
    const m = /^#\/card\/([^?]*)(?:\?(.*))?$/.exec(location.hash || "");
    if (!m) return null;
    let ref;
    try { ref = m[1].split("/").map(decodeURIComponent).join("/"); } catch (_) { ref = m[1]; }
    const q = new URLSearchParams(m[2] || "");
    return { ref, tab: q.get("tab"), mode: q.get("mode"), raw: q.has("raw") ? q.get("raw") === "1" : null };
  }
  function syncUrl(how) {
    const h = buildHash();
    if (h !== location.hash) history[how === "replace" ? "replaceState" : "pushState"]({ viewer: 1 }, "", h);
    lastHash = location.hash;
  }
  function revealAncestors(item) {
    const path = pathTo(item.id);
    for (const anc of path.slice(0, -1)) {
      const k = kindOf(anc);
      if (isCollapsed(k, anc.id)) revealSet.add(anc.id);
    }
  }
  function showNotFound(ref) {
    currentId = null; currentItem = null;
    showItemView(); renderNav();
    $("item-view").classList.add("not-found");
    $("crumbs").innerHTML = "";
    $("item-title").textContent = "Card not found";
    $("diff-badge").innerHTML = "";
    setTab("overview", true);
    $("overview-host").innerHTML = `<div class="ov-card self nf-card"><div class="nf-title">Card not found</div>` +
      `<div class="ov-body">There is no card <code>${esc(ref)}</code> in this sprint plan. ` +
      `It may have been renamed, moved or removed. Pick a card from the tree on the left.</div></div>`;
    $("diff-host").innerHTML = ""; $("fields-host").innerHTML = "";
    document.title = "Card not found · Sprint plan";
    lastHash = location.hash;
  }
  // Apply the URL to the view without adding history entries. Returns false if the URL has no card.
  async function applyUrl() {
    const st = parseHash();
    if (!st) return false;
    lastHash = location.hash;
    if (st.mode && URL_TO_MODE[st.mode]) { viewMode = URL_TO_MODE[st.mode]; setModeBtns(); }
    if (st.tab) currentTab = st.tab === "diff" ? "diff" : "overview";
    const item = findByRef(st.ref);
    if (!item) { showNotFound(st.ref); return true; }
    if (st.raw !== null) { if (st.raw) rawMap[item.id] = true; else delete rawMap[item.id]; } // in memory only
    revealAncestors(item);
    const p = selectItem(item.id, { history: "none" });
    syncUrl("replace"); // normalise the URL (e.g. folder id → Jira key, missing params)
    await p;
    return true;
  }
  window.addEventListener("popstate", () => { applyUrl(); });
  window.addEventListener("hashchange", () => { if (location.hash !== lastHash) applyUrl(); });

  $("hide-done").addEventListener("change", () => { hideDone=$("hide-done").checked; renderNav(); });
  $("only-changed").addEventListener("change", () => { onlyChanged=$("only-changed").checked; renderNav(); });
  $("tab-overview").addEventListener("click", () => { setTab("overview"); syncUrl("push"); });
  $("tab-diff").addEventListener("click", () => { setTab("diff"); syncUrl("push"); });
  const goHandler = e => {
    const tabBtn = e.target.closest("[data-tab]");
    if (tabBtn) { setTab(tabBtn.dataset.tab); syncUrl("push"); return; }
    if (e.target.closest("a[href]")) return;
    const g = e.target.closest("[data-goto]");
    if (g) selectItem(g.dataset.goto);
  };
  $("overview-host").addEventListener("click", goHandler);
  $("crumbs").addEventListener("click", goHandler);
  function setViewMode(m) {
    viewMode = m;
    try { localStorage.setItem(LS_DIFFMODE, m); } catch (_) {}
    setModeBtns(); paintDiff();
    syncUrl("replace");
  }
  $("mode-split").addEventListener("click", () => setViewMode("split"));
  $("mode-unified").addEventListener("click", () => setViewMode("unified"));
  $("mode-render").addEventListener("click", () => setViewMode("render"));
  $("mode-raw").addEventListener("click", () => {
    if (!currentItem) return;
    if (rawMap[currentItem.id]) delete rawMap[currentItem.id]; else rawMap[currentItem.id] = true;
    try { localStorage.setItem(LS_RAW, JSON.stringify(rawMap)); } catch (_) {}
    paintDiff();
    syncUrl("replace");
  });
  setTimeout(() => setModeBtns(), 0);
  function setModeBtns() {
    ["split","unified","render"].forEach(m => {
      $("mode-"+m).classList.toggle("active", viewMode===m);
    });
  }
  
  document.getElementById("fold-bar")?.querySelectorAll("button[data-fold]").forEach(btn => {
    btn.addEventListener("click", () => applyFoldCommand(btn.dataset.fold));
  });

  async function loadNumberingBanner() {
    try {
      const data = await (await fetch("/api/numbering-audit", { cache: "no-store" })).json();
      const a = data.audit || {};
      const n = (a.gaps||[]).length + (a.duplicates||[]).length + (a.parent_mismatches||[]).length;
      const b = $("numbering-banner");
      if (!b) return;
      if (n === 0 && !(a.folder_vs_plan_notes||[]).length) { b.classList.remove("show"); return; }
      b.classList.add("show");
      b.innerHTML = `Numbering audit: <b>${(a.gaps||[]).length}</b> gaps, <b>${(a.duplicates||[]).length}</b> duplicates, <b>${(a.parent_mismatches||[]).length}</b> parent mismatches, <b>${(a.folder_vs_plan_notes||[]).length}</b> folder≠US# notes. <a id="open-audit">View report</a>`;
      document.getElementById("open-audit")?.addEventListener("click", () => {
        $("changes-view").classList.add("show");
        $("item-view").classList.add("hide");
        $("changes-view").innerHTML = `<h2>Numbering audit</h2><pre style="white-space:pre-wrap;font-size:12px">${esc(data.markdown||"")}</pre>`;
      });
    } catch (e) { console.warn(e); }
  }

  $("btn-changes").addEventListener("click", showChangesPage);
  $("btn-refresh").addEventListener("click", async () => {
    try { await loadManifest(); await loadState(); toast("Refreshed"); if (currentId) selectItem(currentId, { history: "replace" }); }
    catch(e) { toast(String(e)); }
  });
  $("btn-pull").addEventListener("click", async () => {
    const btn=$("btn-pull"); btn.disabled=true; btn.textContent="Pulling…";
    try {
      const data = await (await fetch("/api/pull",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"})).json();
      if (data.ok && data.manifest) { manifest=data.manifest; renderNav(); toast("Pull complete"); }
      else toast("Pull failed:\\n"+(data.log_tail||data.error||""), 8000);
    } catch(e) { toast(String(e)); }
    finally { btn.disabled=false; btn.textContent="Pull from Jira"; }
  });
  $("reviewed").addEventListener("change", () => {
    if (!currentId) return;
    state.reviewed[currentId]=$("reviewed").checked; scheduleSave(); renderNav();
  });
  $("btn-save-note").addEventListener("click", () => {
    if (!currentId) return;
    state.notes[currentId]=$("notes").value; scheduleSave(); toast("Saved");
  });
  $("notes").addEventListener("input", () => {
    if (!currentId) return;
    state.notes[currentId]=$("notes").value; scheduleSave();
  });
  $("lightbox").addEventListener("click", () => $("lightbox").classList.remove("show"));

  (async () => {
    try {
      await loadState(); await loadManifest(); await loadNumberingBanner();
      if (await applyUrl()) return;
      // open first changed
      let first = null;
      for (const e of manifest.epics||[]) {
        if (e.change_kind && e.change_kind!=="unchanged") { first=e.id; break; }
        for (const s of e.stories||[]) if (s.change_kind!=="unchanged") { first=s.id; break; }
        if (first) break;
      }
      if (first) selectItem(first, { history: "replace" });
      else if (manifest.epics?.[0]) selectItem(manifest.epics[0].id, { history: "replace" });
    } catch(e) {
      $("nav").innerHTML = `<div class="empty-state">${esc(String(e))}</div>`;
    }
  })();
})();
</script>
</body>
</html>
